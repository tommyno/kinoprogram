# Rebuilds the site on Vercel every six hours so the program stays fresh.
# Needs the repository secret VERCEL_DEPLOY_HOOK (Vercel → Settings → Git → Deploy Hooks).
name: Rebuild

on:
  schedule:
    # Every six hours at an off-peak minute (UTC). The 23:37 run lands just after midnight
    # in Oslo in winter (01:37 in summer) and switches "i dag" to the new date
    - cron: '37 5,11,17,23 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK mangler"
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 -X POST "$VERCEL_DEPLOY_HOOK"
